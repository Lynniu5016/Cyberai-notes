<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberAI Notes — 資安與 AI 知識庫</title>
  <meta name="description" content="資安攻防、密碼學／PKI 與 AI 應用的學習筆記與實作紀錄。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <!-- 1. 標題區 -->
    <section class="hero" id="hero">
      <h1>資安與 AI 知識庫</h1>
      <p>記錄滲透測試、偵測鑑識、密碼學／PKI 與 AI 應用的學習筆記與實作紀錄。每篇筆記都盡量做到「看完就能重現或理解」。</p>
      <span class="hero__count" id="article-count">載入中…</span>
    </section>

    <!-- 2. 分類篩選 -->
    <section id="articles">
      <div class="filters" id="filters" role="group" aria-label="文章篩選">
        <div class="filters__search">
          <input type="search" id="search-input" placeholder="搜尋標題、摘要或標籤…" aria-label="搜尋文章">
        </div>
        <!-- 分類按鈕由 app.js 產生 -->
      </div>

      <!-- 3. 文章卡片網格 -->
      <div class="card-grid" id="article-list"></div>

      <!-- 4. 空狀態 -->
      <div class="callout" id="empty-state" hidden>這個分類還沒有文章。</div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
